version: 2
updates:
  - package-ecosystem: npm
    directory: /bllueprint-frontend
    schedule:
      interval: weekly
    groups:
      angular:
        patterns: ['@angular/*', 'angular-eslint', '@angular-eslint/*']
      dev-tooling:
        dependency-type: development
    # Angular 21 pins: @angular/cdk must stay on 21 and @ng-icons on 34 (see CLAUDE.md)
    ignore:
      - dependency-name: '@angular/*'
        update-types: ['version-update:semver-major']
      - dependency-name: '@ng-icons/*'
        update-types: ['version-update:semver-major']

  - package-ecosystem: npm
    directory: /bllueprint-desktop
    schedule:
      interval: weekly
    ignore:
      - dependency-name: electron
        update-types: ['version-update:semver-major']

  - package-ecosystem: nuget
    directory: /bllueprint-backend
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
