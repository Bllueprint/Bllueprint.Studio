# Multi-stage release pipeline for the desktop app.
#
#   verify ──► e2e-web ──► package (windows / macos / linux) ──► publish
#
# - Runs on tags `v*` (publishes a draft GitHub Release) and manually
#   (artifacts only).
# - Code signing is driven by repository secrets. When they are absent the
#   packages are produced unsigned, so the pipeline can be exercised before a
#   certificate service is connected. See "Signing" below.
#
# Signing (electron-builder conventions, https://www.electron.build/code-signing):
#   Windows  WIN_CSC_LINK (base64 .pfx or URL), WIN_CSC_KEY_PASSWORD
#            — or switch the windows step to Azure Trusted Signing / SignPath
#              once the certificate service is chosen.
#   macOS    CSC_LINK, CSC_KEY_PASSWORD (Developer ID Application .p12),
#            APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID (notarization).
#   Linux    AppImage is not signed by electron-builder; publish checksums instead.

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  NODE_VERSION: 22

jobs:
  verify:
    name: Verify (lint, unit tests, audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bllueprint-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: bllueprint-frontend/package-lock.json
      - run: npm ci --legacy-peer-deps
      - run: npm run lint
      - run: npx prettier --check src docs e2e playwright.config.ts eslint.config.js
      - run: npx ng test --watch=false
      - run: npm audit --omit=dev --audit-level=high

  e2e-web:
    name: Regression (web, production build)
    needs: verify
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bllueprint-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: bllueprint-frontend/package-lock.json
      - run: npm ci --legacy-peer-deps
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-web-report
          path: |
            bllueprint-frontend/e2e/.report
            bllueprint-frontend/e2e/.results
          retention-days: 7

  package:
    name: Package (${{ matrix.os }})
    needs: e2e-web
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win
            artifact: windows
            app_exe: release/win-unpacked/Bllueprint.exe
          - os: macos-latest
            target: --mac
            artifact: macos
            app_exe: release/mac-arm64/Bllueprint.app/Contents/MacOS/Bllueprint
          - os: ubuntu-latest
            target: --linux
            artifact: linux
            app_exe: ''
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: bllueprint-desktop
    env:
      # macOS: do not try to pick a keychain identity when no certificate is configured.
      CSC_IDENTITY_AUTO_DISCOVERY: ${{ secrets.CSC_LINK != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install (frontend)
        working-directory: bllueprint-frontend
        run: npm ci --legacy-peer-deps

      - name: Install (desktop)
        run: npm ci --legacy-peer-deps

      - name: Build frontend + Electron main/preload
        run: npm run build

      - name: Package
        run: npx electron-builder ${{ matrix.target }} --publish never
        env:
          # Windows signing (optional until the certificate service is connected)
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          # macOS signing + notarization (optional)
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      # Smoke test of the packaged app (app:// scheme, CSP, sandboxed bridge, Monaco).
      - name: Install Playwright
        if: matrix.app_exe != ''
        working-directory: bllueprint-frontend
        run: npx playwright install chromium

      - name: Smoke test (packaged app)
        if: matrix.app_exe != ''
        working-directory: bllueprint-frontend
        env:
          BLLUEPRINT_APP_EXE: ${{ github.workspace }}/bllueprint-desktop/${{ matrix.app_exe }}
        run: npm run test:e2e:electron

      - name: Checksums
        shell: bash
        run: |
          cd release
          find . -maxdepth 1 -type f \( -name '*.exe' -o -name '*.dmg' -o -name '*.AppImage' -o -name '*.zip' \) \
            -exec sh -c 'for f; do shasum -a 256 "$f" > "$f.sha256"; done' sh {} +

      - uses: actions/upload-artifact@v4
        with:
          name: bllueprint-${{ matrix.artifact }}
          path: |
            bllueprint-desktop/release/*.exe
            bllueprint-desktop/release/*.dmg
            bllueprint-desktop/release/*.AppImage
            bllueprint-desktop/release/*.zip
            bllueprint-desktop/release/*.blockmap
            bllueprint-desktop/release/*.yml
            bllueprint-desktop/release/*.sha256
          if-no-files-found: error

  publish:
    name: Publish draft release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Draft GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: artifacts/**/*
