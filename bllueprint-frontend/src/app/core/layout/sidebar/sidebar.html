<hlm-sidebar collapsible="icon" class="app-sidebar">
  <hlm-sidebar-header>
    <div class="app-sidebar__brand">
      <span class="app-sidebar__logo" aria-hidden="true">
        <!-- Bllueprint app icon (Assets/AppIco*.svg): curly brackets + abstract "B".
             stroke=currentColor so it follows the theme ink. -->
        <svg
          width="28"
          height="28"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.5"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M6 4H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h2" />
          <path d="M18 4h2a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-2" />
          <path d="M8 7h6a3 3 0 0 1 0 5H8z" />
          <path d="M8 12h7a3 3 0 1 1 0 5H8z" />
        </svg>
      </span>
      <span class="app-sidebar__name">Bllueprint</span>
    </div>
  </hlm-sidebar-header>

  <hlm-sidebar-content>
    <hlm-sidebar-group>
      <div hlmSidebarGroupLabel>Workspace</div>
      <div hlmSidebarGroupContent>
        <ul hlmSidebarMenu>
          @for (item of navItems; track item.kind) {
            <li hlmSidebarMenuItem>
              <button
                hlmSidebarMenuButton
                type="button"
                [isActive]="activeKind() === item.kind"
                [tooltip]="item.label"
                (click)="item.action()"
              >
                <ng-icon [name]="item.icon" />
                <span>{{ item.label }}</span>
              </button>
            </li>
          }
        </ul>
      </div>
    </hlm-sidebar-group>
  </hlm-sidebar-content>

  <hlm-sidebar-footer>
    <ul hlmSidebarMenu>
      <li hlmSidebarMenuItem>
        <button hlmSidebarMenuButton type="button" size="sm" tooltip="Information">
          <ng-icon name="lucideInfo" />
          <span>About</span>
        </button>
      </li>
      <li hlmSidebarMenuItem>
        <button hlmSidebarMenuButton type="button" size="sm" tooltip="Help">
          <ng-icon name="lucideCircleHelp" />
          <span>Help</span>
        </button>
      </li>
    </ul>
  </hlm-sidebar-footer>

  <button hlmSidebarRail type="button" aria-label="Toggle sidebar"></button>
</hlm-sidebar>
